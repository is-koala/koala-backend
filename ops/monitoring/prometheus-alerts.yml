groups:
  - name: koala-backend
    rules:
      - alert: KoalaHighHttp5xxRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.05
        for: 10m
        labels: { severity: critical, owner: backend }
        annotations: { summary: "Backend HTTP 5xx oranı yüzde 5'i aştı" }
      - alert: KoalaPaymentIntegrationFailure
        expr: sum(increase(koala_payment_operations_total{operation=~"initiation|callback",outcome=~"provider_error|persistence_error|amount_mismatch|three_ds_verification_failed|manual_review_required"}[5m])) > 0
        for: 1m
        labels: { severity: critical, owner: payments }
        annotations: { summary: "Ödeme başlatma veya callback entegrasyonu hata verdi" }
      - alert: KoalaPaymentInitiationAbandoned
        expr: sum(increase(koala_payment_operations_total{operation="initiation",outcome="abandoned"}[15m])) > 0
        for: 1m
        labels: { severity: critical, owner: payments }
        annotations: { summary: "Sağlayıcıya ulaşmamış bir ödeme denemesi süpürüldü; atama bloke, elle mutabakat gerekiyor (docs/runbooks/payments.md)" }
      - alert: KoalaPayoutSettlementOverdue
        expr: max(koala_payout_settlement_overdue) > 0
        for: 15m
        labels: { severity: critical, owner: payments }
        annotations: { summary: "Bir hakediş banka mutabakatı kanıtı gelmeden PROCESSING'de bekliyor; hiçbir otomatik yol kapatmaz (docs/runbooks/payments.md §4)" }
      - alert: KoalaPayoutSettlementStalled
        expr: max(koala_payout_settlement_stalled) > 0
        for: 15m
        labels: { severity: critical, owner: payments }
        annotations: { summary: "Bir hakedis ilk yukseltmeden sonra da mutabakat edilemedi; saglayici kaydi kapanmamis demektir (docs/runbooks/payments.md §4)" }
      - alert: KoalaPayoutSettlementEvidenceMismatch
        expr: sum(increase(koala_payment_operations_total{operation="payout_settlement",outcome="evidence_mismatch"}[15m])) > 0
        for: 1m
        labels: { severity: warning, owner: payments }
        annotations: { summary: "Bildirilen mutabakat kanıtı payout kaydıyla eşleşmedi; hakediş PROCESSING kaldı (docs/runbooks/payments.md §4)" }
      - alert: KoalaPaymentFailureSpike
        expr: sum(rate(koala_payment_operations_total{operation="callback",outcome=~"declined|fraud_rejected"}[10m])) > 0.05
        for: 5m
        labels: { severity: warning, owner: payments }
        annotations: { summary: "Ödeme reddi veya dolandırıcılık reddi yükseldi" }
      - alert: KoalaRabbitConsumerLag
        expr: rabbitmq_queue_messages_ready{queue=~"email\\.queue|sms\\.queue|push\\.queue"} > 100
        for: 10m
        labels: { severity: warning, owner: backend }
        annotations: { summary: "RabbitMQ tüketici kuyruğu büyüyor" }
      - alert: KoalaNotificationDispatchBacklog
        expr: max(koala_notification_dispatch_backlog) > 100
        for: 10m
        labels: { severity: warning, owner: backend }
        annotations: { summary: "Bildirim outbox kuyruğunda 100'den fazla gönderim bekliyor" }
      - alert: KoalaNotificationDispatchOldestAge
        expr: max(koala_notification_dispatch_oldest_age_seconds) > 600
        for: 5m
        labels: { severity: critical, owner: backend }
        annotations: { summary: "En eski gönderilmemiş bildirim 10 dakikadan uzun süredir bekliyor" }
      - alert: KoalaNotificationDispatchTerminalBrokerFailure
        expr: max(koala_notification_dispatch_terminal_broker_failures) > 0
        for: 1m
        labels: { severity: critical, owner: backend }
        annotations: { summary: "Bildirim outbox gönderimi broker hataları nedeniyle kalıcı olarak durdu" }
      - alert: KoalaUserProfileSyncBacklog
        expr: max(koala_user_profile_sync_backlog) > 100
        for: 10m
        labels: { severity: warning, owner: payments }
        annotations: { summary: "Iyzico profil senkron outbox kuyruğunda 100'den fazla gönderim bekliyor" }
      - alert: KoalaUserProfileSyncOldestAge
        expr: max(koala_user_profile_sync_oldest_age_seconds) > 600
        for: 5m
        labels: { severity: critical, owner: payments }
        annotations: { summary: "En eski gönderilmemiş Iyzico profil senkronu 10 dakikadan uzun süredir bekliyor" }
      - alert: KoalaUserProfileSyncTerminalBrokerFailure
        expr: max(koala_user_profile_sync_terminal_broker_failures) > 0
        for: 1m
        labels: { severity: critical, owner: payments }
        annotations: { summary: "Iyzico profil senkron outbox gönderimi broker hataları nedeniyle kalıcı olarak durdu" }
      - alert: KoalaNotificationDeliveryParkingQueue
        expr: rabbitmq_queue_messages_ready{queue="notification.delivery.busy.parking.queue"} > 0
        for: 1m
        labels: { severity: critical, owner: backend }
        annotations: { summary: "Bildirim teslimatı aktif claim süresi boyunca ilerleyemeyip park edildi" }
      - alert: KoalaRabbitDeadLetterQueue
        expr: rabbitmq_queue_messages_ready{queue=~".*(dlq|dead-letter).*"} > 0
        for: 5m
        labels: { severity: critical, owner: backend }
        annotations: { summary: "Dead-letter kuyruğunda mesaj var" }
      - alert: KoalaScheduledJobFailure
        expr: increase(tasks_scheduled_execution_seconds_count{outcome="ERROR"}[15m]) > 0
        for: 1m
        labels: { severity: critical, owner: backend }
        annotations: { summary: "Zamanlanmış görev başarısız oldu" }
      - alert: KoalaBackupStale
        expr: time() - koala_backup_last_success_timestamp_seconds > 93600
        for: 15m
        labels: { severity: critical, owner: platform }
        annotations: { summary: "Başarılı veritabanı yedeği 26 saati geçti" }
      - alert: KoalaCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 1209600
        for: 1h
        labels: { severity: warning, owner: platform }
        annotations: { summary: "TLS sertifikasının bitmesine 14 günden az kaldı" }
