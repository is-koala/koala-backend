services:
  koala-app:
    container_name: koala-app
    build: .
    mem_limit: ${KOALA_APP_MEM:-1200m}
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      koala-db:
        condition: service_healthy
      koala-rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nginx-network

  koala-db:
    container_name: koala-db
    image: postgres:17
    mem_limit: ${KOALA_DB_MEM:-768m}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-koalaDB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimli degil}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - koala_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - nginx-network

  koala-rabbitmq:
    container_name: koala-rabbitmq
    image: rabbitmq:4.1.3-management
    mem_limit: ${KOALA_RABBITMQ_MEM:-384m}
    environment:
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: ${RABBITMQ_MEM_WATERMARK:-0.6}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME tanimli degil}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD tanimli degil}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - koala_rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - nginx-network

volumes:
  koala_db_data:
  koala_rabbitmq_data:

networks:
  nginx-network:
    external: true
