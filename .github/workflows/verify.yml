name: koala verify

# Kapı: CLAUDE.md §0/§6'daki komutun aynısı (unit + IT, Testcontainers).
# ubuntu-latest'te Docker hazır; Postgres ve RabbitMQ kapları Testcontainers'tan.
#
# push: main, yayının kanıtı için var. Squash merge yeni bir SHA üretir; PR
# koşusu o SHA'yı hiç görmez. `koala release` yalnız bu workflow'un aynı
# SHA'da yeşil koşusu varsa imaj basar.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Aynı PR'a arka arkaya push gelirse eskisi iptal edilir. main iptal edilmez:
# her birleşen commit'in sonucu yayın kapısında okunuyor.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify
        run: ./mvnw -B -ntp verify -Dkoala.test.latch-timeout=30

      # Kota dolduğunda CreateArtifact kırmızısı verify sonucunu ezmesin (#185).
      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_attempt }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 3
