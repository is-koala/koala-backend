name: koala ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: ./mvnw -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          retention-days: 14

  build:
    name: build and push
    needs: test
    if: github.event_name == 'push'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Çalışma katmanındaki iki kabuk komutu hedef mimaride koşuyor; runner ARM64,
      # hedef amd64 olduğu için emülasyon gerekiyor. Maven derlemesi bunun dışında.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Dağıtım hedefi amd64 (Hetzner x86_64); runner ise ARM64 bir Pi.
          # Platform verilmediğinde imaj runner'ın mimarisinde basılıyordu ve
          # hedefte "no matching manifest" ile hiç açılmazdı.
          #
          # TEK platform, bilinçli: iki platform basıldığında ortaya bir OCI
          # indeksi çıkıyor ve GHCR o indeksin alt manifest'lerini servis
          # etmedi — Dokploy `latest`i çözebildi ama içindeki
          # sha256:2aada4...'ı 404 aldı ve imajı hiç çekemedi. Tek platformda
          # indeks hiç oluşmuyor, etiket doğrudan tek manifest'i gösteriyor.
          # ARM bir sunucuya geçilirse buraya linux/arm64 yazılır; ikisi
          # birden gerekiyorsa önce o çözülmeli.
          platforms: linux/amd64
          # Attestation kapalı, bilinçli: build-push-action provenance'ı
          # varsayılan olarak üretiyor ve attestation ayrı bir manifest olarak
          # indeksin içine giriyor. Yani tek platformda bile indeks oluşmak
          # zorunda kalıyor — indeksin taşıması gereken iki şey var. GHCR o
          # indeksin alt manifest'lerini servis etmedi ve Dokploy imajı hiç
          # çekemedi. Kapatınca tek platformda düz manifest basılıyor: etiket
          # doğrudan imajı gösteriyor, çözülecek ikinci katman kalmıyor.
          provenance: false
          sbom: false
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/koala:${{ steps.version.outputs.VERSION }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}/koala:latest', github.repository_owner) || '' }}

  deploy:
    name: deploy
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: self-hosted
    steps:
      - name: Trigger Dokploy deploy
        run: curl -fsSL -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}"
