name: koala ci

# Verify and the GHCR image run on Yusuf's Mac. GitHub only curls the
# Dokploy webhook after a v* tag (or a manual dispatch), on the org
# self-hosted runners. It does not rebuild the image.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Trigger Dokploy deploy
        run: curl -fsSL -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}"
