name: koala ci

# Verify and the GHCR image run on Yusuf's Mac. GitHub only curls the
# Dokploy webhook after a v* tag, and only after that image is already on
# GHCR. ubuntu-latest is seconds of hosted minutes, not a runner queue.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Dokploy deploy
        run: curl -fsSL -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}"
