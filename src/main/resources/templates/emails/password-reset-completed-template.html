<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koala - Parolan değiştirildi</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,sans-serif;color:#282828;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f5f7;padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:20px;overflow:hidden;">
                <tr>
                    <td style="padding:28px 32px;background:#f15757;color:#ffffff;font-size:26px;font-weight:700;">Koala</td>
                </tr>
                <tr>
                    <td style="padding:36px 32px;">
                        <h1 style="margin:0 0 18px;font-size:26px;line-height:1.25;">Parolan değiştirildi</h1>
                        <p style="margin:0 0 20px;font-size:16px;line-height:1.6;">Merhaba <span th:text="${firstName}">Kullanıcı</span>, Koala hesabının parolası başarıyla değiştirildi ve mevcut oturumların kapatıldı.</p>
                        <p style="margin:0;font-size:15px;line-height:1.6;color:#5d6169;">Bu işlemi sen yapmadıysan hesabını korumak için hemen <a href="mailto:info@iskoala.com" style="color:#d94343;font-weight:700;">info@iskoala.com</a> adresinden bize ulaş.</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:22px 32px;background:#fafafa;font-size:13px;line-height:1.5;color:#777777;">Bu e-posta hesap güvenliğin için otomatik olarak gönderildi.</td>
                </tr>
            </table>
        </td>
    </tr>
</table>
<img th:if="${trackingUrl != null}" th:src="${trackingUrl}" width="1" height="1" alt="" style="position:absolute;visibility:hidden;display:block;">
</body>
</html>
