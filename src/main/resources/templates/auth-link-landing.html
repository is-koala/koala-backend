<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="referrer" content="no-referrer">
    <title th:text="${title} + ' | Koala'">Koala</title>
</head>
<body style="margin:0;min-height:100vh;background:#f4f5f7;font-family:Arial,sans-serif;color:#282828;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;">
<main style="width:100%;max-width:520px;background:#ffffff;border-radius:24px;box-shadow:0 14px 40px rgba(40,40,40,.12);overflow:hidden;">
    <header style="padding:28px 32px;background:#f15757;color:#ffffff;font-size:28px;font-weight:700;">Koala</header>
    <section style="padding:38px 32px;">
        <p style="margin:0 0 10px;color:#d94343;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;">Güvenli hesap işlemi</p>
        <h1 th:text="${title}" style="margin:0 0 18px;font-size:28px;line-height:1.2;">Koala'da devam et</h1>
        <p th:text="${message}" style="margin:0 0 28px;color:#5d6169;font-size:16px;line-height:1.6;">İşleme uygulamada devam et.</p>
        <a th:if="${appLink != null}" th:href="${appLink}" th:text="${buttonLabel}" href="#" rel="noreferrer" style="display:block;padding:14px 20px;background:#f15757;color:#ffffff;text-align:center;text-decoration:none;border-radius:12px;font-size:16px;font-weight:700;">Koala Staging'de aç</a>
        <p style="margin:22px 0 0;color:#777777;font-size:13px;line-height:1.5;">Uygulama açılmazsa Koala Staging sürümünün bu cihazda kurulu olduğundan emin ol. Bu sayfa hesabında tek başına değişiklik yapmaz.</p>
    </section>
</main>
</body>
</html>
