spring:
  application:
    name: koala

  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/koalaDB}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      jakarta:
        persistence:
          validation:
            mode: none

  jackson:
    deserialization:
      fail-on-null-for-primitives: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true

  messages:
    basename: messages
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:42MB}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  tomcat:
    max-swallow-size: ${MAX_SWALLOW_SIZE:50MB}
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    mime-types: application/json,application/javascript,text/javascript,text/css,text/html,text/plain
    min-response-size: 1KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
    build:
      enabled: true

info:
  app:
    version: ${SERVICE_VERSION:@project.version@}

logging:
  level:
    com.exskylab.koala: ${APP_LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    http.access: ${ACCESS_LOG_LEVEL:INFO}
    nl.basjes: ${USER_AGENT_LOG_LEVEL:WARN}
  structured:
    ecs:
      service:
        name: ${SERVICE_NAME:koala}
        version: ${SERVICE_VERSION:@project.version@}
        environment: ${SERVICE_ENVIRONMENT:}

springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
    doc-expansion: none
    default-models-expand-depth: -1
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs

admin:
  bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}

app:
  deployment: ${SERVICE_ENVIRONMENT:local}
  minimum-version: ${APP_MINIMUM_VERSION:}
  api-url: ${API_URL:http://localhost:8080}
  web-base-url: ${WEB_BASE_URL:http://localhost:3000}
  trusted-proxies: ${APP_TRUSTED_PROXIES:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

koala:
  staff:
    auth:
      access-token-validity: ${STAFF_ACCESS_TOKEN_VALIDITY:15m}
      refresh-token-validity: ${STAFF_REFRESH_TOKEN_VALIDITY:12h}
      max-failed-attempts: ${STAFF_MAX_FAILED_ATTEMPTS:5}
      lock-duration: ${STAFF_LOCK_DURATION:15m}
    bootstrap:
      owner-email: ${BOOTSTRAP_OWNER_EMAIL:}
      owner-password: ${BOOTSTRAP_OWNER_PASSWORD:}
    bridge:
      open: ${STAFF_MARKETPLACE_BRIDGE_OPEN:false}

payments:
  return-base-url: ${PAYMENTS_RETURN_BASE_URL:koala-staging://}

auth-links:
  public-base-url: ${AUTH_LINK_PUBLIC_BASE_URL:${WEB_BASE_URL:http://localhost:3000}}
  app-scheme: ${AUTH_LINK_APP_SCHEME:koala-staging}

email:
  delivery:
    mode: ${MAIL_DELIVERY_MODE:ALLOWLIST}
    allowed-recipients: ${MAIL_ALLOWED_RECIPIENTS:}
  support:
    mailbox: ${SUPPORT_MAILBOX:info@iskoala.com}

push:
  firebase:
    enabled: ${FIREBASE_PUSH_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    connect-timeout: ${FIREBASE_CONNECT_TIMEOUT:5s}
    read-timeout: ${FIREBASE_READ_TIMEOUT:10s}
    write-timeout: ${FIREBASE_WRITE_TIMEOUT:10s}
  delivery:
    max-attempts: ${PUSH_MAX_ATTEMPTS:3}
    initial-backoff: ${PUSH_INITIAL_BACKOFF:1m}
    max-backoff: ${PUSH_MAX_BACKOFF:15m}
    max-provider-deferral: ${PUSH_MAX_PROVIDER_DEFERRAL:24h}
    claim-timeout: ${PUSH_CLAIM_TIMEOUT:10m}
    batch-size: ${PUSH_BATCH_SIZE:100}
    fixed-delay: ${PUSH_DELIVERY_FIXED_DELAY:30s}

jwt:
  secret: ${JWT_SECRET:}
  access-token:
    expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:43200000}
  password-set:
    expiration-ms: ${JWT_PASSWORD_SET_EXPIRATION_MS:600000}

password-reset:
  token-validity-ms: ${PASSWORD_RESET_TOKEN_VALIDITY_MS:${JWT_PASSWORD_RESET_EXPIRATION_MS:900000}}

notification-preferences:
  unsubscribe-token-validity-ms: ${UNSUBSCRIBE_TOKEN_VALIDITY_MS:7776000000}

notification:
  dispatch:
    enabled: ${NOTIFICATION_DISPATCH_ENABLED:true}
    fixed-delay: ${NOTIFICATION_DISPATCH_FIXED_DELAY:PT5S}
    max-attempts: ${NOTIFICATION_DISPATCH_MAX_ATTEMPTS:8}
    initial-backoff: ${NOTIFICATION_DISPATCH_INITIAL_BACKOFF:PT5S}
    max-backoff: ${NOTIFICATION_DISPATCH_MAX_BACKOFF:PT5M}
    jitter-factor: ${NOTIFICATION_DISPATCH_JITTER_FACTOR:0.5}
    claim-timeout: ${NOTIFICATION_DISPATCH_CLAIM_TIMEOUT:PT5M}
    publisher-confirm-timeout: ${NOTIFICATION_DISPATCH_PUBLISHER_CONFIRM_TIMEOUT:PT10S}
    delivery-claim-timeout: ${NOTIFICATION_DELIVERY_CLAIM_TIMEOUT:PT5M}
    provider-timeout: ${NOTIFICATION_PROVIDER_TIMEOUT:PT45S}
    delivery-busy-retry-interval: ${NOTIFICATION_DELIVERY_BUSY_RETRY_INTERVAL:PT5S}
    delivery-busy-max-retries: ${NOTIFICATION_DELIVERY_BUSY_MAX_RETRIES:61}
    legacy-grace-period: ${NOTIFICATION_DISPATCH_LEGACY_GRACE_PERIOD:PT15M}
    batch-size: ${NOTIFICATION_DISPATCH_BATCH_SIZE:50}
    executor:
      threads: ${NOTIFICATION_DISPATCH_EXECUTOR_THREADS:4}
      queue-capacity: ${NOTIFICATION_DISPATCH_EXECUTOR_QUEUE_CAPACITY:50}

user-profile-sync:
  dispatch:
    enabled: ${USER_PROFILE_SYNC_DISPATCH_ENABLED:true}
    fixed-delay: ${USER_PROFILE_SYNC_DISPATCH_FIXED_DELAY:PT5S}
    max-attempts: ${USER_PROFILE_SYNC_DISPATCH_MAX_ATTEMPTS:8}
    initial-backoff: ${USER_PROFILE_SYNC_DISPATCH_INITIAL_BACKOFF:PT5S}
    max-backoff: ${USER_PROFILE_SYNC_DISPATCH_MAX_BACKOFF:PT5M}
    jitter-factor: ${USER_PROFILE_SYNC_DISPATCH_JITTER_FACTOR:0.5}
    claim-timeout: ${USER_PROFILE_SYNC_DISPATCH_CLAIM_TIMEOUT:PT5M}
    publisher-confirm-timeout: ${USER_PROFILE_SYNC_DISPATCH_PUBLISHER_CONFIRM_TIMEOUT:PT10S}
    processing-claim-timeout: ${USER_PROFILE_SYNC_PROCESSING_CLAIM_TIMEOUT:PT5M}
    batch-size: ${USER_PROFILE_SYNC_DISPATCH_BATCH_SIZE:50}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  eviction-cron: ${RATE_LIMIT_EVICTION_CRON:0 */10 * * * *}
  max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:10}
  window: ${RATE_LIMIT_WINDOW:1m}
  upload:
    max-attempts: ${RATE_LIMIT_UPLOAD_MAX_ATTEMPTS:20}
    window: ${RATE_LIMIT_UPLOAD_WINDOW:1m}
  message:
    max-attempts: ${RATE_LIMIT_MESSAGE_MAX_ATTEMPTS:30}
    window: ${RATE_LIMIT_MESSAGE_WINDOW:1m}
  write:
    max-attempts: ${RATE_LIMIT_WRITE_MAX_ATTEMPTS:60}
    window: ${RATE_LIMIT_WRITE_WINDOW:1m}
  realtime-subscribe:
    max-attempts: ${RATE_LIMIT_REALTIME_SUBSCRIBE_MAX_ATTEMPTS:30}
    window: ${RATE_LIMIT_REALTIME_SUBSCRIBE_WINDOW:1m}
  realtime-message:
    max-attempts: ${RATE_LIMIT_REALTIME_MESSAGE_MAX_ATTEMPTS:60}
    window: ${RATE_LIMIT_REALTIME_MESSAGE_WINDOW:1m}
  realtime-credential:
    max-attempts: ${RATE_LIMIT_REALTIME_CREDENTIAL_MAX_ATTEMPTS:10}
    window: ${RATE_LIMIT_REALTIME_CREDENTIAL_WINDOW:1m}
  address-search:
    max-attempts: ${RATE_LIMIT_ADDRESS_SEARCH_MAX_ATTEMPTS:60}
    window: ${RATE_LIMIT_ADDRESS_SEARCH_WINDOW:1m}
  public:
    max-attempts: ${RATE_LIMIT_PUBLIC_MAX_ATTEMPTS:120}
    window: ${RATE_LIMIT_PUBLIC_WINDOW:1m}
  sitemap:
    max-attempts: ${RATE_LIMIT_SITEMAP_MAX_ATTEMPTS:30}
    window: ${RATE_LIMIT_SITEMAP_WINDOW:1m}

commission:
  rate: ${COMMISSION_RATE:0.075}

messaging:
  grace-days-after-job: ${MESSAGING_GRACE_DAYS_AFTER_JOB:7}
  zone-id: ${MESSAGING_ZONE_ID:Europe/Istanbul}

job-search:
  zone-id: ${JOB_SEARCH_ZONE_ID:Europe/Istanbul}

sitemap:
  manifest:
    ttl: ${SITEMAP_MANIFEST_TTL:1h}
    refresh-before-expiry: ${SITEMAP_MANIFEST_REFRESH_BEFORE_EXPIRY:15m}
    shard-size: ${SITEMAP_MANIFEST_SHARD_SIZE:50000}
    max-shards: ${SITEMAP_MANIFEST_MAX_SHARDS:50000}
    query-timeout: ${SITEMAP_MANIFEST_QUERY_TIMEOUT:20s}
    lock-timeout: ${SITEMAP_MANIFEST_LOCK_TIMEOUT:5s}

address-search:
  enabled: ${ADDRESS_SEARCH_ENABLED:false}
  api-key: ${GOOGLE_PLACES_API_KEY:}
  places-base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}
  geocoding-base-url: ${GOOGLE_GEOCODING_BASE_URL:https://maps.googleapis.com}
  session-ttl: ${ADDRESS_SEARCH_SESSION_TTL:5m}
  candidate-ttl: ${ADDRESS_CANDIDATE_TTL:10m}

job-alert:
  enabled: ${JOB_ALERT_ENABLED:true}
  max-per-user: ${JOB_ALERT_MAX_PER_USER:10}

assignment:
  auto-completion:
    enabled: ${ASSIGNMENT_AUTO_COMPLETION_ENABLED:true}
    grace-days: ${ASSIGNMENT_AUTO_COMPLETION_GRACE_DAYS:3}
    batch-size: ${ASSIGNMENT_AUTO_COMPLETION_BATCH_SIZE:100}
    zone-id: ${ASSIGNMENT_AUTO_COMPLETION_ZONE_ID:Europe/Istanbul}
    cron: ${ASSIGNMENT_AUTO_COMPLETION_CRON:0 15 * * * *}
  unpaid-expiry:
    enabled: ${ASSIGNMENT_UNPAID_EXPIRY_ENABLED:true}
    hours-before-start: ${ASSIGNMENT_UNPAID_EXPIRY_HOURS_BEFORE_START:6}
    batch-size: ${ASSIGNMENT_UNPAID_EXPIRY_BATCH_SIZE:100}
    zone-id: ${ASSIGNMENT_UNPAID_EXPIRY_ZONE_ID:Europe/Istanbul}
    cron: ${ASSIGNMENT_UNPAID_EXPIRY_CRON:0 45 * * * *}

payout:
  settlement:
    overdue-monitoring-enabled: ${PAYOUT_SETTLEMENT_OVERDUE_MONITORING_ENABLED:true}
    overdue-after: ${PAYOUT_SETTLEMENT_OVERDUE_AFTER:3d}
    stalled-after: ${PAYOUT_SETTLEMENT_STALLED_AFTER:10d}
    overdue-cron: ${PAYOUT_SETTLEMENT_OVERDUE_CRON:0 20 * * * *}

audit:
  retention:
    enabled: ${AUDIT_RETENTION_ENABLED:true}
    core-months: ${AUDIT_RETENTION_CORE_MONTHS:24}
    financial-core-months: ${AUDIT_RETENTION_FINANCIAL_CORE_MONTHS:120}
    detail-months: ${AUDIT_RETENTION_DETAIL_MONTHS:6}
    cron: ${AUDIT_RETENTION_CRON:0 30 3 * * *}

login-attempt:
  retention:
    enabled: ${LOGIN_ATTEMPT_RETENTION_ENABLED:true}
    attributed-days: ${LOGIN_ATTEMPT_RETENTION_ATTRIBUTED_DAYS:365}
    unattributed-days: ${LOGIN_ATTEMPT_RETENTION_UNATTRIBUTED_DAYS:30}
    cron: ${LOGIN_ATTEMPT_RETENTION_CRON:0 50 3 * * *}

bank:
  verification:
    collection-iban: ${BANK_VERIFICATION_COLLECTION_IBAN:}
    validity-hours: ${BANK_VERIFICATION_VALIDITY_HOURS:72}
    max-attempts: ${BANK_VERIFICATION_MAX_ATTEMPTS:5}
    minimum-amount: ${BANK_VERIFICATION_MIN_AMOUNT:1.01}
    maximum-amount: ${BANK_VERIFICATION_MAX_AMOUNT:1.99}

identity:
  passive-authentication:
    enabled: ${IDENTITY_PASSIVE_AUTH_ENABLED:false}
    trust-anchor-directory: ${IDENTITY_CSCA_DIRECTORY:}
    active-authentication-required: ${IDENTITY_ACTIVE_AUTH_REQUIRED:false}
    challenge-validity-minutes: ${IDENTITY_CHALLENGE_VALIDITY_MINUTES:10}

realtime:
  enabled: ${REALTIME_ENABLED:true}
  endpoint: ${REALTIME_ENDPOINT:/ws}
  typing-timeout: ${REALTIME_TYPING_TIMEOUT:5s}
  origins:
    production: ${STOMP_PRODUCTION_ORIGIN:}
    staging: ${STOMP_STAGING_ORIGIN:}
    development: ${STOMP_DEVELOPMENT_ORIGIN:}

cancellation:
  free-window-hours: ${CANCELLATION_FREE_WINDOW_HOURS:24}
  late-fee-rate: ${CANCELLATION_LATE_FEE_RATE:0.50}
  zone-id: ${CANCELLATION_ZONE_ID:Europe/Istanbul}

timesheet:
  max-offline-age: ${TIMESHEET_MAX_OFFLINE_AGE:72h}
  max-future-skew: ${TIMESHEET_MAX_FUTURE_SKEW:5m}
  zone-id: ${TIMESHEET_ZONE_ID:Europe/Istanbul}

session:
  refresh-validity-days: ${SESSION_REFRESH_VALIDITY_DAYS:30}
  refresh-sliding-window-days: ${SESSION_REFRESH_SLIDING_WINDOW_DAYS:7}

sms:
  iletiMerkezi:
    apiKey: ${SMS_API_KEY:}
    apiHash: ${SMS_API_HASH:}
    sender: ${SMS_SENDER:KOALA}

iys:
  enabled: ${IYS_ENABLED:false}
  api-url: ${IYS_API_URL:https://api.iletimerkezi.com/v1/consent}
  api-key: ${IYS_API_KEY:}
  api-hash: ${IYS_API_HASH:}
  brand-code: ${IYS_BRAND_CODE:}
  sources:
    web: ${IYS_SOURCE_WEB:HS_WEB}
    mobile: ${IYS_SOURCE_MOBILE:HS_MOBIL}
    unknown: ${IYS_SOURCE_UNKNOWN:HS_EORTAM}
    unsubscribe: ${IYS_SOURCE_UNSUBSCRIBE:HS_EPOSTA}
  permission-max-age: ${IYS_PERMISSION_MAX_AGE:1h}
  claim-timeout: ${IYS_CLAIM_TIMEOUT:5m}
  recipient-encryption-key: ${IYS_RECIPIENT_ENCRYPTION_KEY:}
  deletion-withdrawal-retention: ${IYS_DELETION_WITHDRAWAL_RETENTION:3d}
  retry:
    enabled: ${IYS_RETRY_ENABLED:true}
    fixed-delay: ${IYS_RETRY_FIXED_DELAY:30s}
    max-attempts: ${IYS_RETRY_MAX_ATTEMPTS:8}
    initial-backoff: ${IYS_RETRY_INITIAL_BACKOFF:1m}
    max-backoff: ${IYS_RETRY_MAX_BACKOFF:6h}
    batch-size: ${IYS_RETRY_BATCH_SIZE:50}
  reconciliation:
    enabled: ${IYS_RECONCILIATION_ENABLED:true}
    fixed-delay: ${IYS_RECONCILIATION_FIXED_DELAY:15m}
    batch-size: ${IYS_RECONCILIATION_BATCH_SIZE:50}

storage:
  type: ${STORAGE_TYPE:local}
  bucket: ${STORAGE_BUCKET:}
  region: ${STORAGE_REGION:eu-central-1}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  endpoint: ${STORAGE_ENDPOINT:}
  public-url: ${STORAGE_PUBLIC_URL:}
  signed-url-minutes: ${STORAGE_SIGNED_URL_MINUTES:3}
  local:
    path: ${STORAGE_LOCAL_PATH:uploads}

upload:
  max-image-size-mb: ${UPLOAD_MAX_IMAGE_SIZE_MB:10}
  max-file-size-mb: ${UPLOAD_MAX_FILE_SIZE_MB:10}
  max-company-images: ${UPLOAD_MAX_COMPANY_IMAGES:10}
  max-job-images: ${UPLOAD_MAX_JOB_IMAGES:10}
  max-image-megapixels: ${UPLOAD_MAX_IMAGE_MEGAPIXELS:50}

company-follow:
  enabled: ${COMPANY_FOLLOW_ENABLED:true}

account-deletion:
  enabled: ${ACCOUNT_DELETION_ENABLED:true}
  waiting-period: ${ACCOUNT_DELETION_WAITING_PERIOD:30d}
  batch-size: ${ACCOUNT_DELETION_BATCH_SIZE:100}
  cron: ${ACCOUNT_DELETION_CRON:0 30 2 * * *}

error-monitoring:
  enabled: ${SENTRY_ENABLED:false}
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:}
  release: ${SENTRY_RELEASE:}

iyzico:
  apiKey: ${IYZICO_API_KEY:}
  secretKey: ${IYZICO_SECRET_KEY:}
  baseUrl: ${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
  deployment: ${SERVICE_ENVIRONMENT:local}
  settlementEnabled: ${IYZICO_SETTLEMENT_ENABLED:true}
  settlement-retry:
    enabled: ${IYZICO_SETTLEMENT_RETRY_ENABLED:true}
    max-attempts: ${IYZICO_SETTLEMENT_MAX_ATTEMPTS:8}
    initial-backoff: ${IYZICO_SETTLEMENT_INITIAL_BACKOFF:1m}
    max-backoff: ${IYZICO_SETTLEMENT_MAX_BACKOFF:6h}
    batch-size: ${IYZICO_SETTLEMENT_BATCH_SIZE:50}
    cron: ${IYZICO_SETTLEMENT_CRON:0 */5 * * * *}
  payment-verification:
    enabled: ${IYZICO_PAYMENT_VERIFICATION_ENABLED:true}
    max-attempts: ${IYZICO_PAYMENT_VERIFICATION_MAX_ATTEMPTS:8}
    initial-reconciliation-delay: ${IYZICO_PAYMENT_INITIAL_RECONCILIATION_DELAY:35m}
    initiation-deadline: ${IYZICO_PAYMENT_INITIATION_DEADLINE:15m}
    initial-backoff: ${IYZICO_PAYMENT_VERIFICATION_INITIAL_BACKOFF:1m}
    max-backoff: ${IYZICO_PAYMENT_VERIFICATION_MAX_BACKOFF:6h}
    batch-size: ${IYZICO_PAYMENT_VERIFICATION_BATCH_SIZE:50}
    cron: ${IYZICO_PAYMENT_VERIFICATION_CRON:30 */5 * * * *}
