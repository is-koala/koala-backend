# Sadece testler icin. Uretimde kullanilmaz.
# Datasource'u AbstractIntegrationTest icindeki Testcontainers saglar.

spring.application.name=koala-test

# Gelistirici makinesindeki .env testlere sizmasin.
spring.config.import=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.jakarta.persistence.validation.mode=none

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

jwt.secret=dGVzdC1vbmx5LXNlY3JldC1uZXZlci11c2VkLWluLXByb2R1Y3Rpb24tMDEyMzQ1Njc4OWFiY2RlZg==
jwt.password-set.expiration-ms=600000
jwt.password-reset.expiration-ms=900000
jwt.access-token.expiration-ms=43200000

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.jackson.deserialization.fail-on-null-for-primitives=false

spring.messages.basename=messages
spring.messages.encoding=UTF-8

# AppProperties @NotBlank oldugu icin bos birakilamaz.
app.api-url=http://localhost:8080
app.web-base-url=http://localhost:3000
payments.return-base-url=koala-staging://

# R2ClientConfig acilista URI.create(endpoint) cagiriyor; null olursa context dusuyor.

iyzico.apiKey=test-api-key
iyzico.secretKey=test-secret-key
iyzico.baseUrl=http://localhost:9998

sms.iletiMerkezi.apiKey=test-api-key
sms.iletiMerkezi.apiHash=test-api-hash
sms.iletiMerkezi.sender=KOALA

# Testlerde RabbitMQ'ya baglanilmiyor; dinleyiciler elle baslatilir (hic baslatilmaz).
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

logging.level.org.springframework.amqp=ERROR
logging.level.liquibase=WARN

# Testlerde hiz siniri kapali; acikca test eden sinif kendi ornegini kurar.
rate-limit.enabled=false
assignment.auto-completion.enabled=false
iyzico.settlement-retry.enabled=false
iyzico.payment-verification.enabled=false
storage.type=local
storage.local.path=target/test-uploads
job-alert.enabled=false
assignment.unpaid-expiry.enabled=false
audit.retention.enabled=false

# Her onbellege alinan test context'i kendi Hikari havuzunu tutar; varsayilan 10
# baglanti x context sayisi tek Postgres kabinin max_connections=100 sinirini asiyordu.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
